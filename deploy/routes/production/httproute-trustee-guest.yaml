apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trustee-guest
  namespace: trustee-system
spec:
  parentRefs:
    - name: trustee-public
      sectionName: https
  hostnames:
    - kbs.example.invalid
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /kbs/v0/auth
        - method: POST
          path:
            type: Exact
            value: /kbs/v0/attest
        - method: GET
          path:
            type: PathPrefix
            value: /kbs/v0/resource/
        - method: GET
          path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: trustee-guest
          port: 8443
