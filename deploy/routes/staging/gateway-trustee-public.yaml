apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: trustee-public
  namespace: trustee-system
spec:
  gatewayClassName: REPLACE_ME
  listeners:
    - name: https
      hostname: kbs.staging.example.invalid
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: trustee-public-tls
      allowedRoutes:
        namespaces:
          from: Same
