apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trustee-allow-postgres
  namespace: trustee-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trustee
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
