apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trustee-allow-provisioner
  namespace: trustee-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trustee
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trustee-provisioner
      ports:
        - protocol: TCP
          port: 8080
