apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustee
  namespace: trustee-system
  labels:
    app.kubernetes.io/name: trustee
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trustee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustee
    spec:
      serviceAccountName: trustee
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trustee
          image: trustee-image
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/kbs
          args:
            - --config-file
            - /etc/trustee/kbs-config.toml
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: trustee-runtime
                  key: POSTGRES_URL
            - name: RUST_LOG
              value: warn
          ports:
            - name: https
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            failureThreshold: 3
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/trustee
              readOnly: true
            - name: runtime
              mountPath: /run/trustee/token
              readOnly: true
            - name: postgres-ca
              mountPath: /run/trustee/postgres
              readOnly: true
            - name: serving-tls
              mountPath: /run/trustee/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: trustee-config
        - name: runtime
          secret:
            secretName: trustee-runtime
            defaultMode: 0440
            items:
              - key: ATTESTATION_TOKEN_SIGNING_KEY
                path: attestation-token.key
              - key: ATTESTATION_TOKEN_SIGNING_CHAIN
                path: attestation-token-chain.pem
              - key: ATTESTATION_TOKEN_ROOT_CA
                path: attestation-token-root-ca.pem
        - name: postgres-ca
          secret:
            secretName: trustee-runtime
            defaultMode: 0440
            items:
              - key: POSTGRES_CA_CERT
                path: ca.crt
        - name: serving-tls
          secret:
            secretName: trustee-backend-tls
            defaultMode: 0440
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
