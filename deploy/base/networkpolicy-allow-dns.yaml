apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trustee-allow-dns
  namespace: trustee-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trustee
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
